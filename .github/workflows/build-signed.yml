name: Build iOS IPA (signed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Sign and export IPA
    runs-on: macos-15
    timeout-minutes: 50
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Apple signing secrets
        run: |
          set -euo pipefail
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROFILE_BASE64 IOS_TEAM_ID IOS_BUNDLE_ID IOS_KEYCHAIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing secret: $name" >&2
              exit 1
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import certificate and provisioning profile
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          cd "$RUNNER_TEMP/signing"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > distribution.p12
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > distribution.mobileprovision
          KEYCHAIN="$RUNNER_TEMP/aujunpeak-signing.keychain-db"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import distribution.p12 -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security cms -D -i distribution.mobileprovision > profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp distribution.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          rm -f distribution.p12

      - name: Archive signed application
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project AujunpeakUI.xcodeproj \
            -scheme AujunpeakUI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/.build/AujunpeakUI.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Create ExportOptions.plist
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          values = {
              'method': 'release-testing',
              'destination': 'export',
              'signingStyle': 'manual',
              'teamID': os.environ['IOS_TEAM_ID'],
              'signingCertificate': 'Apple Distribution',
              'provisioningProfiles': {
                  os.environ['IOS_BUNDLE_ID']: os.environ['PROFILE_NAME']
              }
          }
          with open('ExportOptions.plist', 'wb') as f:
              plistlib.dump(values, f)
          PY

      - name: Export signed IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$PWD/.build/AujunpeakUI.xcarchive" \
            -exportPath "$PWD/output" \
            -exportOptionsPlist "$PWD/ExportOptions.plist"
          find output -maxdepth 1 -name '*.ipa' -print

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: AujunpeakVN-signed-ipa
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 14
