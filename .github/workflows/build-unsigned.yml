name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build on macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile iOS app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project AujunpeakUI.xcodeproj \
            -scheme AujunpeakUI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$PWD/.build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p .build/staging/Payload output
          cp -R .build/DerivedData/Build/Products/Release-iphoneos/AujunpeakUI.app .build/staging/Payload/
          (cd .build/staging && zip -qyr ../../output/AujunpeakVN-unsigned.ipa Payload)
          unzip -l output/AujunpeakVN-unsigned.ipa | head -25

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AujunpeakVN-unsigned-ipa
          path: output/AujunpeakVN-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
