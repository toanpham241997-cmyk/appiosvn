name: AujunpeakUI
options:
  bundleIdPrefix: vn.aujunpeak
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: vi
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  AujunpeakUI:
    type: application
    platform: iOS
    sources:
      # EXPLICIT V2 FILE ALLOWLIST: do not compile stale v1 screens accidentally kept in GitHub.
      - path: App/AujunpeakApp.swift
      - path: App/Theme.swift
      - path: App/Components/ToastCenter.swift
      - path: App/Services/BoostPreferences.swift
      - path: App/Services/DeviceInfo.swift
      - path: App/Services/GameCatalog.swift
      - path: App/Services/KeyAuthentication.swift
      - path: App/Services/MessageStore.swift
      - path: App/Screens/AccountView.swift
      - path: App/Screens/BoostView.swift
      - path: App/Screens/GamesView.swift
      - path: App/Screens/LoginView.swift
      - path: App/Screens/MessagesView.swift
      - path: App/Screens/OverviewView.swift
      - path: App/Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.aujunpeak.studio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Aujunpeak VN"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
